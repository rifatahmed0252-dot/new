<style>

@media(max-width:820px){.layout{display:block;padding:14px 12px 90px}.sidebar{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat .value{font-size:20px}.page-title h2{font-size:21px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}.mobile-nav button.active{color:var(--brand);font-weight:700}.mobile-nav .ico{font-size:18px}.form-grid{grid-template-columns:1fr}.header-actions .sync{display:none}header{padding:14px 12px}.brand h1{font-size:16px}.header-actions select,.header-actions button{padding:7px 8px}.toolbar input,.toolbar select{min-width:100%}}

 bn:{dashboard:"ড্যাশবোর্ড",products:"পণ্য ও স্টক",movements:"স্টক লেনদেন",sales:"বিক্রি / ইনভয়েস",purchases:"কেনাকাটা",daily:"দৈনিক হিসাব",settings:"সেটিংস",reports:"রিপোর্ট",totalProducts:"মোট পণ্য",stockValue:"স্টকের মূল্য",lowStock:"কম স্টক",salesToday:"আজকের বিক্রি",quickActions:"দ্রুত কাজ",addProduct:"নতুন পণ্য",stockIn:"স্টক যোগ",stockOut:"স্টক বের",newSale:"নতুন বিক্রি",recent:"সাম্প্রতিক স্টক লেনদেন",search:"পণ্য খুঁজুন…",name:"পণ্যের নাম",code:"পণ্য কোড (ঐচ্ছিক)",category:"ক্যাটাগরি",unit:"ইউনিট",length:"দৈর্ঘ্য (ফুট)",buyPrice:"ক্রয়মূল্য (৳)",sellPrice:"বিক্রয়মূল্য (৳)",quantity:"পরিমাণ",save:"সংরক্ষণ",cancel:"বাতিল",actions:"কাজ",product:"পণ্য",stock:"স্টক",price:"বিক্রয়মূল্য",edit:"সম্পাদনা",noProducts:"এখনো কোনো পণ্য নেই। নতুন পণ্য যোগ করুন।",noMoves:"এখনো কোনো স্টক লেনদেন নেই।",addStockTitle:"স্টক যোগ / বের",type:"লেনদেনের ধরন",in:"স্টক যোগ",out:"স্টক বের",note:"নোট (ঐচ্ছিক)",record:"লেনদেন সংরক্ষণ",salesTitle:"বিক্রি / ইনভয়েস",customer:"ক্রেতার নাম (ঐচ্ছিক)",chooseProduct:"পণ্য নির্বাচন",qty:"পরিমাণ",unitPrice:"প্রতি ইউনিট দাম (৳)",createInvoice:"ইনভয়েস তৈরি",invoiceHistory:"এই ডিভাইসের বিক্রির ইতিহাস",total:"মোট",noSales:"এখনো কোনো বিক্রি নেই।",language:"ভাষা",currency:"মুদ্রা",bdt:"বাংলাদেশি টাকা (BDT)",settingsText:"পণ্যের তালিকা ও স্টক এই ডিভাইসে সংরক্ষিত থাকে।",saveSettings:"সেটিংস সংরক্ষণ",dashboardSub:"দোকানের স্টক ও বিক্রির সারাংশ",productSub:"পণ্য যোগ করুন এবং বর্তমান স্টক দেখুন",movesSub:"স্টক বাড়ানো বা কমানোর ইতিহাস",salesSub:"বিক্রি রেকর্ড করুন এবং ইনভয়েস দেখুন",purchasesSub:"মাল কেনার রেকর্ড Stock In থেকে যোগ করুন",purchasesText:"স্টক ইন দিয়ে মাল যোগ করা যায়। সরবরাহকারী ও পূর্ণ Purchase Invoice workflow এখনো আলাদা করে তৈরি হয়নি; কেনার হিসাব Daily Accounts-এ লিখুন।",low:"কম",normal:"স্বাভাবিক",date:"তারিখ",kind:"ধরন",noteLabel:"নোট",empty:"কোনো তথ্য নেই",invoice:"ইনভয়েস",print:"প্রিন্ট / PDF",close:"বন্ধ",successProduct:"পণ্য সংরক্ষণ হয়েছে",successMove:"স্টক লেনদেন সংরক্ষণ হয়েছে",successSale:"বিক্রি সংরক্ষণ হয়েছে",required:"পণ্যের নাম ও পরিমাণ দিন",notEnough:"স্টক পর্যাপ্ত নয়",settingsTitle:"অ্যাপ সেটিংস",appTitle:"অ্যাপের নাম",saveName:"নাম সংরক্ষণ",ownerNote:"লোকাল-ফার্স্ট অ্যাপ। ডেটা এই ডিভাইসের ব্রাউজারে থাকে; নিয়মিত JSON backup রাখুন।",dailySub:"রাতে একসঙ্গে খাতার হিসাব লিখুন",addEntry:"হিসাব যোগ",entryDate:"হিসাবের তারিখ",entryType:"হিসাবের ধরন",entryAmount:"টাকার পরিমাণ (৳)",entryQty:"পরিমাণ",entryProduct:"পণ্য (কেনা/বিক্রির জন্য)",contact:"কাস্টমার/সরবরাহকারী/কর্মচারী",entryNote:"বিবরণ / নোট",saveEntry:"হিসাব সংরক্ষণ",purchaseEntry:"পণ্য কেনা",saleEntry:"পণ্য বিক্রি",expenseEntry:"দৈনিক খরচ",receivableEntry:"কাস্টমারের কাছ থেকে পাওনা",payableEntry:"সরবরাহকারীকে দেনা",salaryEntry:"কর্মচারীর বেতন",ownerInEntry:"",ownerOutEntry:"",cashInEntry:"অন্যান্য নগদ জমা",cashOutEntry:"অন্যান্য নগদ খরচ",otherEntry:"অন্যান্য",dailyTotal:"এই দিনের এন্ট্রি",entrySaved:"দৈনিক হিসাব সংরক্ষণ হয়েছে",entries:"এন্ট্রি",stockEffect:"কেনা-বেচায় স্টক নিজে আপডেট হবে। একই লেনদেন অন্য পেজে আবার লিখবেন না।",all:"সব"},
 en:{dashboard:"Dashboard",products:"Products & Stock",movements:"Stock Movements",sales:"Sales / Invoices",purchases:"Purchases",daily:"Daily Accounts",settings:"Settings",reports:"Reports",totalProducts:"Total products",stockValue:"Stock value",lowStock:"Low stock",salesToday:"Sales today",quickActions:"Quick actions",addProduct:"Add product",stockIn:"Stock in",stockOut:"Stock out",newSale:"New sale",recent:"Recent stock movements",search:"Search products…",name:"Product name",code:"Product code (optional)",category:"Category",unit:"Unit",length:"Length (ft)",buyPrice:"Purchase price (৳)",sellPrice:"Selling price (৳)",quantity:"Quantity",save:"Save",cancel:"Cancel",actions:"Actions",product:"Product",stock:"Stock",price:"Selling price",edit:"Edit",noProducts:"No products yet. Add your first product.",noMoves:"No stock movements yet.",addStockTitle:"Stock in / out",type:"Movement type",in:"Stock in",out:"Stock out",note:"Note (optional)",record:"Save movement",salesTitle:"Sales / invoices",customer:"Customer name (optional)",chooseProduct:"Choose product",qty:"Quantity",unitPrice:"Unit price (৳)",createInvoice:"Create invoice",invoiceHistory:"Sales history on this device",total:"Total",noSales:"No sales yet.",language:"Language",currency:"Currency",bdt:"Bangladeshi Taka (BDT)",settingsText:"Products and stock are saved on this device.",saveSettings:"Save settings",dashboardSub:"Overview of shop stock and sales",productSub:"Add products and review current stock",movesSub:"History of stock increases and decreases",salesSub:"Record a sale and view invoices",purchasesSub:"Record received goods through Stock In",purchasesText:"Use Stock In to add received goods. A separate supplier and purchase-invoice workflow is not included yet; record purchase amounts in Daily Accounts.",low:"Low",normal:"Normal",date:"Date",kind:"Type",noteLabel:"Note",empty:"No data",invoice:"Invoice",print:"Print / PDF",close:"Close",successProduct:"Product saved",successMove:"Stock movement saved",successSale:"Sale saved",required:"Enter product name and quantity",notEnough:"Insufficient stock",settingsTitle:"App settings",appTitle:"App name",saveName:"Save name",ownerNote:"Local-first app. Data stays in this browser on this device; keep regular JSON backups.",dailySub:"Enter the day's notebook accounts together at night",addEntry:"Add entry",entryDate:"Entry date",entryType:"Account type",entryAmount:"Amount (৳)",entryQty:"Quantity",entryProduct:"Product (for purchase/sale)",contact:"Customer / supplier / employee",entryNote:"Description / note",saveEntry:"Save entry",purchaseEntry:"Purchase stock",saleEntry:"Sell stock",expenseEntry:"Daily expense",receivableEntry:"Customer receivable",payableEntry:"Supplier payable",salaryEntry:"Employee salary",ownerInEntry:"",ownerOutEntry:"",cashInEntry:"Other cash received",cashOutEntry:"Other cash paid",otherEntry:"Other",dailyTotal:"Entries for this day",entrySaved:"Daily entry saved",entries:"entries",stockEffect:"Purchase/sale entries update stock automatically. Do not enter the same transaction again on another page.",all:"All"}
};
let lang=localStorage.getItem("tg_lang")||"bn", currentPage="dashboard", dailyViewDate=new Date().toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem("tg_inventory")||'{"products":[],"movements":[],"sales":[],"settings":{"appName":"Inventory Manager"}}');
data.dailyEntries=data.dailyEntries||[];data.sales=data.sales||[];data.movements=data.movements||[];data.products=data.products||[];data.settings=data.settings||{appName:"Thai Glass Inventory"};
data.settings=data.settings||{appName:"Thai Glass Inventory"};
const t=k=>translations[lang][k]||k, money=n=>new Intl.NumberFormat(lang==="bn"?"bn-BD":"en-BD",{style:"currency",currency:"BDT",maximumFractionDigits:2}).format(Number(n)||0), dateFmt=d=>new Date(d).toLocaleString(lang==="bn"?"bn-BD":"en-BD");
function persist(){localStorage.setItem("tg_inventory",JSON.stringify(data));}
function toast(s){$("#toastRoot").innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$("#toastRoot").innerHTML="",2400)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const navItems=[["dashboard","⌂"],["products","▦"],["daily","🗓"],["movements","↕"],["sales","▤"],["purchases","🛒"],["reports","▤"],["settings","⚙"]];
function nav(){const html=navItems.map(([k,i])=>`<button class="nav ${currentPage===k?"active":""}" data-page="${k}"><span class="ico">${i}</span><span>${t(k)}</span></button>`).join("");$("#sideNav").innerHTML=html;$("#mobileNav").innerHTML=navItems.filter(([k])=>k!=="purchases"&&k!=="movements").map(([k,i])=>`<button class="${currentPage===k?"active":""}" data-page="${k}"><span class="ico">${i}</span>${t(k)}</button>`).join("")+`<button data-page="settings" class="${currentPage==="settings"?"active":""}"><span class="ico">⚙</span>${t("settings")}</button>`;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;render()})}
function title(k,sub,action=""){return `<div class="page-title"><div><h2>${t(k)}</h2><p>${t(sub)}</p></div>${action}</div>`}
function stat(k,v,hint=""){return `<div class="stat"><div class="label">${t(k)}</div><div class="value">${v}</div><div class="hint">${hint}</div></div>`}
function productRows(list){if(!list.length)return `<tr><td colspan="6" class="empty">${t("noProducts")}</td></tr>`;return list.map(p=>`<tr><td><strong>${esc(p.name)}</strong><span class="sub">${esc(p.code||p.category||"")}</span></td><td>${esc(p.category||"—")}</td><td>${esc(p.length?`${p.length} ft`:"—")}<span class="sub">${esc(p.unit)}</span></td><td><span class="pill ${p.qty<=Number(p.low||0)?"low":""}">${p.qty}</span></td><td>${money(p.sellPrice)}</td><td><button class="btn secondary" data-edit="${p.id}">${t("edit")}</button></td></tr>`).join("")}
function renderDashboard(){let totalValue=data.products.reduce((s,p)=>s+p.qty*p.buyPrice,0), low=data.products.filter(p=>p.qty<=Number(p.low||0)).length, today=new Date().toDateString(), salesToday=data.sales.filter(s=>new Date(s.date).toDateString()===today).reduce((s,x)=>s+x.total,0);
return title("dashboard","dashboardSub",`<button class="btn" id="dashAdd">＋ ${t("addProduct")}</button>`)+`<div class="stats">${stat("totalProducts",data.products.length,t("all"))}${stat("stockValue",money(totalValue),t("bdt"))}${stat("lowStock",low,t("low"))}${stat("salesToday",money(salesToday),t("bdt"))}</div><section class="panel"><div class="panel-head"><h3>${t("quickActions")}</h3></div><div class="toolbar"><button class="btn" id="quickProduct">＋ ${t("addProduct")}</button><button class="btn secondary" id="quickIn">＋ ${t("stockIn")}</button><button class="btn secondary" id="quickOut">− ${t("stockOut")}</button><button class="btn secondary" id="quickSale">▤ ${t("newSale")}</button></div></section><section class="panel"><div class="panel-head"><h3>${t("recent")}</h3><button class="btn secondary" data-page="movements">${t("all")}</button></div>${movementTable(data.movements.slice(-5).reverse())}</section>`}
function renderProducts(){return title("products","productSub",`<button class="btn" id="addProductBtn">＋ ${t("addProduct")}</button>`)+`<section class="panel"><div class="toolbar"><input id="productSearch" placeholder="${t("search")}"><select id="catFilter"><option value="">${t("all")} ${t("category")}</option>${[...new Set(data.products.map(p=>p.category).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div class="table-wrap"><table><thead><tr><th>${t("product")}</th><th>${t("category")}</th><th>${t("length")} / ${t("unit")}</th><th>${t("stock")}</th><th>${t("price")}</th><th>${t("actions")}</th></tr></thead><tbody id="productBody">${productRows(data.products)}</tbody></table></div></section>`}
function movementTable(list){return `<div class="table-wrap"><table><thead><tr><th>${t("date")}</th><th>${t("product")}</th><th>${t("kind")}</th><th>${t("quantity")}</th><th>${t("noteLabel")}</th></tr></thead><tbody>${list.length?list.map(m=>{let p=data.products.find(x=>x.id===m.productId);return `<tr><td>${esc(dateFmt(m.date))}</td><td>${esc(p?.name||m.productName||"—")}</td><td><span class="pill ${m.type==="out"?"low":""}">${t(m.type)}</span></td><td>${m.type==="out"?"−":"+"}${m.qty}</td><td>${esc(m.note||"—")}</td></tr>`}).join(""):`<tr><td colspan="5" class="empty">${t("noMoves")}</td></tr>`}</tbody></table></div>`}
function renderMovements(){return title("movements","movesSub",`<button class="btn" id="addMoveBtn">＋ ${t("record")}</button>`)+`<section class="panel">${movementTable(data.movements.slice().reverse())}</section>`}
function renderSales(){return title("sales","salesSub",`<button class="btn" id="newSaleBtn">＋ ${t("newSale")}</button>`)+`<section class="panel"><div class="panel-head"><h3>${t("invoiceHistory")}</h3></div><div class="table-wrap"><table><thead><tr><th>${t("invoice")}</th><th>${t("date")}</th><th>${t("customer")}</th><th>${t("total")}</th><th>${t("actions")}</th></tr></thead><tbody>${data.sales.length?data.sales.slice().reverse().map(s=>`<tr><td>${esc(s.invoice)}</td><td>${esc(dateFmt(s.date))}</td><td>${esc(s.customer||"—")}</td><td>${money(s.total)}</td><td><button class="btn secondary" data-invoice="${s.id}">${t("print")}</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">${t("noSales")}</td></tr>`}</tbody></table></div></section>`}
function renderPurchases(){return title("purchases","purchasesSub")+`<section class="panel"><p>${t("purchasesText")}</p><button class="btn" id="purchaseInBtn">＋ ${t("stockIn")}</button></section>`}
function entryTypeLabel(type){const keys={purchase:"purchaseEntry",sale:"saleEntry",expense:"expenseEntry",receivable:"receivableEntry",payable:"payableEntry",salary:"salaryEntry",cash_in:"cashInEntry",cash_out:"cashOutEntry",other:"otherEntry"};return t(keys[type]||"otherEntry")}
function renderDaily(){const today=dailyViewDate;const entries=data.dailyEntries.filter(e=>e.date===today);const sum=type=>entries.filter(e=>e.type===type).reduce((a,e)=>a+Number(e.amount||0),0);const totalExpense=sum("expense")+sum("salary")+sum("cash_out");const rows=entries.length?entries.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(entryTypeLabel(e.type))}</td><td>${esc(e.productName||"—")}${e.qty?`<span class="sub">${e.qty} ${esc(e.unit||"")}</span>`:""}</td><td>${esc(e.contact||"—")}</td><td>${money(e.amount)}</td><td>${esc(e.note||"—")}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">${t("empty")}</td></tr>`;return title("daily","dailySub",`<button class="btn" id="addDailyEntry">＋ ${t("addEntry")}</button>`)+`<div class="stats">${stat("saleEntry",money(sum("sale")),t("entries")+": "+entries.filter(e=>e.type==="sale").length)}${stat("purchaseEntry",money(sum("purchase")),t("entries")+": "+entries.filter(e=>e.type==="purchase").length)}${stat("expenseEntry",money(totalExpense),t("entries"))}${stat("dailyTotal",entries.length,t("entries"))}</div><section class="panel"><div class="notice">${t("stockEffect")}</div><div class="panel-head"><h3>${t("dailyTotal")}</h3><input id="dailyViewDate" type="date" value="${esc(today)}" style="max-width:190px"></div><div class="table-wrap"><table><thead><tr><th>${t("entryDate")}</th><th>${t("entryType")}</th><th>${t("product")} / ${t("entryQty")}</th><th>${t("contact")}</th><th>${t("entryAmount")}</th><th>${t("entryNote")}</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function dailyEntryModal(){
 const today=new Date().toISOString().slice(0,10);
 const types=[["purchase","purchaseEntry"],["sale","saleEntry"],["expense","expenseEntry"],["receivable","receivableEntry"],["payable","payableEntry"],["salary","salaryEntry"],["cash_in","cashInEntry"],["cash_out","cashOutEntry"],["other","otherEntry"]];
 const typeOptions=types.map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join("");
 const productOptions=data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.qty} ${esc(p.unit)}</option>`).join("");
 let rowNo=0;
 const makeRow=()=>{const id=++rowNo;return `<tr class="daily-entry-row" data-row="${id}"><td><select class="row-type" aria-label="${t("entryType")}">${typeOptions}</select></td><td><select class="row-product" aria-label="${t("product")}"><option value="">—</option>${productOptions}</select></td><td><input class="row-qty" type="number" min=".01" step=".001" value="1" aria-label="${t("entryQty")}" style="width:90px"></td><td><input class="row-amount" type="number" min="0" step=".01" required aria-label="${t("entryAmount")}" style="width:120px"></td><td><input class="row-contact" aria-label="${t("contact")}" placeholder="${t("contact")}" style="width:140px"></td><td><input class="row-note" aria-label="${t("entryNote")}" placeholder="${t("entryNote")}" style="width:140px"></td><td><button type="button" class="btn danger row-remove" aria-label="Remove row">×</button></td></tr>`};
 openModal(`<h3>${t("addEntry")} — একসঙ্গে একাধিক এন্ট্রি</h3><form id="dailyEntryForm"><div class="field" style="margin-bottom:12px"><label>${t("entryDate")} *</label><input name="date" id="dailyBatchDate" type="date" required value="${today}"></div><div class="table-wrap"><table style="min-width:820px"><thead><tr><th>${t("entryType")}</th><th>${t("product")}</th><th>${t("entryQty")}</th><th>${t("entryAmount")}</th><th>${t("contact")}</th><th>${t("entryNote")}</th><th>×</th></tr></thead><tbody id="dailyEntryRows">${makeRow()}</tbody></table></div><div class="toolbar" style="margin-top:12px;align-items:center"><button type="button" class="btn secondary" id="dailyAddRow">＋ আরেকটি লাইন</button><strong id="dailyBatchTotal" style="margin-left:auto">মোট: ৳0</strong></div><p class="sub">${t("stockEffect")}</p><div class="form-actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn">সব এন্ট্রি একসঙ্গে সেভ</button></div></form>`);
 const rowsEl=$("#dailyEntryRows");
 const updateRow=(row,force=false)=>{const type=row.querySelector(".row-type").value,stockType=["purchase","sale"].includes(type),prodSel=row.querySelector(".row-product"),qty=row.querySelector(".row-qty"),amount=row.querySelector(".row-amount");prodSel.disabled=!stockType;qty.disabled=!stockType;qty.required=stockType;if(stockType){const pr=data.products.find(x=>x.id===prodSel.value);if(pr&&(force||!amount.value))amount.value=((type==="purchase"?pr.buyPrice:pr.sellPrice)||0)*(Number(qty.value)||1)}else if(force)amount.value="";};
 const updateTotal=()=>{const total=[...rowsEl.querySelectorAll(".row-amount")].reduce((n,x)=>n+(Number(x.value)||0),0);$("#dailyBatchTotal").textContent="মোট: "+money(total)};
 const bindRow=row=>{row.querySelector(".row-type").onchange=()=>{updateRow(row,true);updateTotal()};row.querySelector(".row-product").onchange=()=>{updateRow(row,true);updateTotal()};row.querySelector(".row-qty").oninput=()=>{updateRow(row,true);updateTotal()};row.querySelector(".row-amount").oninput=updateTotal;row.querySelector(".row-remove").onclick=()=>{if(rowsEl.children.length>1)row.remove();else{row.querySelector(".row-amount").value="";row.querySelector(".row-contact").value="";row.querySelector(".row-note").value=""}updateTotal()};updateRow(row,true)};
 [...rowsEl.querySelectorAll(".daily-entry-row")].forEach(bindRow);
 $("#dailyAddRow").onclick=()=>{rowsEl.insertAdjacentHTML("beforeend",makeRow());bindRow(rowsEl.lastElementChild);updateTotal()};
 $("#dailyEntryForm").onsubmit=e=>{e.preventDefault();const date=$("#dailyBatchDate").value;if(!date)return;const pending=[...rowsEl.querySelectorAll(".daily-entry-row")].map(row=>{const type=row.querySelector(".row-type").value,qty=Number(row.querySelector(".row-qty").value||0),amount=Number(row.querySelector(".row-amount").value),productId=row.querySelector(".row-product").value;return {type,qty,amount,productId,contact:row.querySelector(".row-contact").value.trim(),note:row.querySelector(".row-note").value.trim()}}).filter(x=>x.amount!==0||x.note||x.contact||(["purchase","sale"].includes(x.type)&&x.qty>0));
 if(!pending.length||pending.some(x=>!Number.isFinite(x.amount)||x.amount<0||(["purchase","sale"].includes(x.type)&&(!x.productId||x.qty<=0)))){toast(t("required"));return}
 const requiredOut={};for(const x of pending){if(x.type==="sale"){requiredOut[x.productId]=(requiredOut[x.productId]||0)+x.qty}}
 for(const [pid,q] of Object.entries(requiredOut)){const pr=data.products.find(z=>z.id===pid);if(!pr||q>pr.qty){toast(t("notEnough"));return}}
 for(const x of pending){let pr=null;if(x.type==="purchase"||x.type==="sale")pr=data.products.find(z=>z.id===x.productId);const entry={id:crypto.randomUUID(),date,type:x.type,amount:x.amount,qty:["purchase","sale"].includes(x.type)?x.qty:0,productId:pr?.id||null,productName:pr?.name||"",unit:pr?.unit||"",contact:x.contact,note:x.note,createdAt:new Date().toISOString(),stockApplied:false};if(x.type==="purchase"&&pr){pr.qty+=x.qty;data.movements.push({id:crypto.randomUUID(),productId:pr.id,productName:pr.name,type:"in",qty:x.qty,note:x.note||"Daily purchase",date:new Date(date+"T12:00:00").toISOString(),sourceEntryId:entry.id});entry.stockApplied=true}if(x.type==="sale"&&pr){pr.qty-=x.qty;const sale={id:crypto.randomUUID(),invoice:"TG-D-"+Date.now().toString().slice(-7)+"-"+Math.random().toString(36).slice(2,5).toUpperCase(),date:new Date(date+"T12:00:00").toISOString(),customer:x.contact,items:[{productId:pr.id,name:pr.name,qty:x.qty,price:x.amount/x.qty}],total:x.amount,sourceEntryId:entry.id};data.sales.push(sale);data.movements.push({id:crypto.randomUUID(),productId:pr.id,productName:pr.name,type:"out",qty:x.qty,note:x.note||sale.invoice,date:sale.date,sourceEntryId:entry.id});entry.stockApplied=true;entry.invoice=sale.invoice}data.dailyEntries.push(entry)}persist();closeModal();render();toast(`${pending.length}টি এন্ট্রি সংরক্ষণ হয়েছে`)}
}
function renderReportStats(m){const es=data.dailyEntries.filter(e=>(e.date||"").slice(0,7)===m);const sum=k=>es.filter(e=>e.type===k).reduce((a,e)=>a+Number(e.amount||0),0);const vals=[sum("sale"),sum("purchase"),sum("expense")+sum("salary")+sum("cash_out"),sum("sale")-sum("purchase")-sum("expense")-sum("salary")-sum("cash_out"),sum("cash_in"),sum("cash_out")+sum("salary")+sum("expense"),sum("receivable"),sum("payable")];document.querySelectorAll("#page .stat .value").forEach((el,i)=>{if(vals[i]!==undefined)el.textContent=money(vals[i])})}
function renderReports(){const month=(new Date().toISOString().slice(0,7));const entries=data.dailyEntries.filter(e=>(e.date||"").slice(0,7)===month);const sum=type=>entries.filter(e=>e.type===type).reduce((a,e)=>a+Number(e.amount||0),0);const sales=sum("sale"),purchases=sum("purchase"),expenses=sum("expense")+sum("salary")+sum("cash_out"),cashIn=sum("cash_in"),cashOut=sum("cash_out")+sum("salary")+sum("expense");const rows=entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(entryTypeLabel(e.type))}</td><td>${esc(e.contact||e.productName||"—")}</td><td>${money(e.amount)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">${t("empty")}</td></tr>`;return title("reports","dailySub")+`<section class="panel"><div class="toolbar"><label class="field" style="min-width:180px;flex:1"><span>রিপোর্টের মাস / Report month</span><input id="reportMonth" type="month" value="${month}"></label><button class="btn secondary" id="reportPrint">প্রিন্ট / Print</button></div><div class="stats">${stat("saleEntry",money(sales))}${stat("purchaseEntry",money(purchases))}${stat("expenseEntry",money(expenses))}${stat("dailyTotal",money(sales-purchases-expenses),"বিক্রি − কেনা − খরচ (আনুমানিক)")}</div><div class="stats">${stat("ownerInEntry",money(cashIn))}${stat("ownerOutEntry",money(cashOut))}${stat("receivableEntry",money(sum("receivable")))}${stat("payableEntry",money(sum("payable")))}</div><p class="sub">এই রিপোর্ট শুধু নির্বাচিত মাসের Daily Accounts এন্ট্রি থেকে তৈরি। পাওনা/দেনার অঙ্ক নতুন করে যোগ করা হয়েছে কি না খেয়াল রাখুন।</p></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>${t("date")}</th><th>${t("entryType")}</th><th>${t("contact")}</th><th>${t("entryAmount")}</th></tr></thead><tbody id="reportRows">${rows}</tbody></table></div></section>`}
let cloudConfig=JSON.parse(localStorage.getItem("tg_cloud_config")||'{"url":"","key":""}');
let cloudClient=null, cloudUser=null, cloudBusinessId=localStorage.getItem("tg_business_id")||"", cloudTimer=null, cloudBusy=false, cloudSyncQueued=false, cloudFirstLoad=true;
const localStateExisted=!!localStorage.getItem("tg_inventory");
function cloudStatusText(){return cloudUser?`লগইন: ${cloudUser.email||cloudUser.id} • ${cloudBusinessId?"ওয়ার্কস্পেস যুক্ত":"ওয়ার্কস্পেস তৈরি/নির্বাচন করো"}`:(cloudConfig.url&&cloudConfig.key?"ক্লাউড সেটআপ সংরক্ষিত; লগইন করো":"ক্লাউড চালু করতে Supabase URL ও anon/publishable key প্রয়োজন")}
function initCloudClient(){if(!cloudConfig.url||!cloudConfig.key)throw new Error("আগে Supabase URL ও anon/publishable key বসাও");if(!window.supabase?.createClient)throw new Error("Supabase লাইব্রেরি লোড হয়নি; ইন্টারনেট সংযোগ দেখো");cloudClient=window.supabase.createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return cloudClient}
function mergeById(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(x=>{if(x&&x.id)m.set(x.id,x)});return [...m.values()]}
function mergeData(local,remote){const out={...remote,...local};for(const k of ["products","movements","sales","dailyEntries"]){out[k]=mergeById(remote?.[k],local?.[k])}out.settings={...(remote?.settings||{}),...(local?.settings||{})};return out}
async function cloudSync(showToast=false){if(!cloudClient||!cloudUser||!cloudBusinessId)return;if(cloudBusy){cloudSyncQueued=true;return}cloudBusy=true;try{const {data:row,error:readErr}=await cloudClient.from("business_app_state").select("payload,updated_at").eq("business_id",cloudBusinessId).maybeSingle();if(readErr)throw readErr;let merged=data;if(row?.payload){merged=(cloudFirstLoad&&!localStateExisted)?row.payload:mergeData(data,row.payload);data=merged;localStorage.setItem("tg_inventory",JSON.stringify(data))}cloudFirstLoad=false;const {error:writeErr}=await cloudClient.from("business_app_state").upsert({business_id:cloudBusinessId,payload:data,updated_by:cloudUser.id,updated_at:new Date().toISOString()},{onConflict:"business_id"});if(writeErr)throw writeErr;const el=$("#cloudStatus");if(el)el.textContent="সিঙ্ক সম্পন্ন • "+new Date().toLocaleTimeString();const label=$("#syncLabel");if(label)label.textContent="Cloud synced";if(showToast)toast("অনলাইন সিঙ্ক সম্পন্ন হয়েছে")}catch(e){const msg=e?.message||"Sync failed";const el=$("#cloudStatus");if(el)el.textContent="সিঙ্ক হয়নি: "+msg;if(showToast)toast("সিঙ্ক হয়নি: "+msg)}finally{cloudBusy=false;if(cloudSyncQueued){cloudSyncQueued=false;setTimeout(()=>cloudSync(false),250)}}}
function scheduleCloudSync(){if(!cloudClient||!cloudUser||!cloudBusinessId)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSync(false),900)}
async function cloudLogin(mode){try{const client=initCloudClient();const email=$("#sbEmail")?.value.trim(),password=$("#sbPassword")?.value;if(!email||!password)throw new Error("ইমেইল ও পাসওয়ার্ড দাও");let result=mode==="signup"?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(result.data.user){cloudUser=result.data.user;if(!result.data.session&&mode==="signup"){toast("ইমেইল ভেরিফাই করে তারপর লগইন করো")}else{await loadCloudWorkspace();toast("লগইন হয়েছে")}render()}}catch(e){toast("লগইন সমস্যা: "+(e.message||e))}}
async function loadCloudWorkspace(){if(!cloudClient)return;const {data:u}=await cloudClient.auth.getUser();cloudUser=u?.user||null;if(!cloudUser)return;const {data:members,error}=await cloudClient.from("business_members").select("business_id,role,businesses(name)").eq("user_id",cloudUser.id);if(error)throw error;if(!members?.length){const el=$("#cloudStatus");if(el)el.textContent="অ্যাকাউন্ট আছে; নতুন ওয়ার্কস্পেস তৈরি করো অথবা মালিককে তোমাকে যোগ করতে বলো।";return}let chosen=members.find(m=>m.business_id===cloudBusinessId)||members[0];cloudBusinessId=chosen.business_id;localStorage.setItem("tg_business_id",cloudBusinessId);await cloudSync(false)}
async function createWorkspace(){try{if(!cloudClient||!cloudUser)throw new Error("আগে লগইন করো");const name=$("#workspaceName")?.value.trim()||"Thai Glass Shop";const {data:bid,error}=await cloudClient.rpc("create_business_workspace",{p_name:name});if(error)throw error;cloudBusinessId=bid;localStorage.setItem("tg_business_id",bid);await cloudSync(false);render();toast("ওয়ার্কস্পেস তৈরি হয়েছে")}catch(e){toast("ওয়ার্কস্পেস তৈরি হয়নি: "+(e.message||e))}}
async function addWorkspaceMember(){try{if(!cloudClient||!cloudUser||!cloudBusinessId)throw new Error("লগইন ও ওয়ার্কস্পেস দরকার");const email=$("#memberEmail")?.value.trim();const role=$("#memberRole")?.value||"employee";if(!email)throw new Error("কর্মচারীর ইমেইল দাও");const {error}=await cloudClient.rpc("add_business_member_by_email",{p_business_id:cloudBusinessId,p_email:email,p_role:role});if(error)throw error;toast("কর্মচারী যোগ হয়েছে")}catch(e){toast("কর্মচারী যোগ হয়নি: "+(e.message||e))}}
async function signOutCloud(){try{if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;cloudBusinessId="";localStorage.removeItem("tg_business_id");const el=$("#syncLabel");if(el)el.textContent="Offline demo";render();toast("লগআউট হয়েছে")}catch(e){toast(e.message||"লগআউট হয়নি")}}
function renderSettings(){return title("settings","settingsText")+`<section class="panel"><h3>${t("settingsTitle")}</h3><div class="form-grid"><div class="field"><label>${t("appTitle")}</label><input id="appNameInput" value="${esc(data.settings.appName||"Thai Glass Inventory")}"></div><div class="field"><label>${t("language")}</label><select id="settingsLang"><option value="bn" ${lang==="bn"?"selected":""}>বাংলা</option><option value="en" ${lang==="en"?"selected":""}>English</option></select></div><div class="field"><label>${t("currency")}</label><input value="${t("bdt")}" disabled></div></div><div class="form-actions"><button class="btn" id="saveSettings">${t("saveSettings")}</button></div></section><section class="panel"><h3>দাম ও শতাংশ / Price & Percentage</h3><p>প্রতিটি পণ্যের Edit অপশনে Fixed Price অথবা Percent বেছে নাও। Percent মোডে মূল দাম, কেনার শতাংশ এবং বিক্রির শতাংশ আলাদা করে বসানো যাবে। যেমন মূল দাম ১,০০০ টাকা, Buy 80% = ৮০০ টাকা, Sell 90% = ৯০০ টাকা।</p></section><section class="panel"><h3>ডেটা ব্যাকআপ</h3><p class="sub">এই সংস্করণে ডেটা এই ডিভাইসের ব্রাউজারে সংরক্ষিত থাকে। অন্য ডিভাইসে অটো-সিঙ্ক নেই।</p><button class="btn danger" id="exportBtn">Export JSON backup</button> <button class="btn secondary" id="importBtn">Import JSON backup</button><input type="file" id="importFile" accept="application/json" class="hidden"></section>`}
function render(){nav();$("#appName").textContent=data.settings.appName||"Thai Glass Inventory";$("#tagline").textContent=lang==="bn"?"স্টক • কেনা-বেচা • দৈনিক হিসাব":"Stock • Purchases • Sales • Daily Accounts";$("#langSelect").value=lang;$("#demoNotice").textContent=lang==="bn"?"ডেটা এই ডিভাইসের ব্রাউজারে সংরক্ষিত থাকে। নিয়মিত Settings থেকে JSON backup ডাউনলোড করে রাখুন।":"Data is stored in this browser on this device. Export a JSON backup regularly from Settings. Online sync is not enabled in this version.";let html=currentPage==="dashboard"?renderDashboard():currentPage==="products"?renderProducts():currentPage==="movements"?renderMovements():currentPage==="sales"?renderSales():currentPage==="purchases"?renderPurchases():currentPage==="daily"?renderDaily():currentPage==="reports"?renderReports():renderSettings();$("#page").innerHTML=html;wirePage()}
function openModal(content){$("#modalRoot").innerHTML=`<div class="modal-backdrop"><div class="modal">${content}</div></div>`;$("#modalRoot").querySelector(".modal-backdrop").onclick=e=>{if(e.target.classList.contains("modal-backdrop"))closeModal()};$("#modalRoot").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal)}
function closeModal(){$("#modalRoot").innerHTML=""}
function productModal(p=null){let x=p||{name:"",code:"",category:"Aluminium",unit:"pcs",length:"",buyPrice:"",sellPrice:"",qty:0,low:0,priceMode:"fixed",basePrice:0,buyPercent:100,sellPercent:100};openModal(`<h3>${p?t("edit"):t("addProduct")}</h3><form id="productForm"><div class="form-grid"><div class="field"><label>${t("name")} *</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>${t("code")}</label><input name="code" value="${esc(x.code)}"></div><div class="field"><label>${t("category")}</label><input name="category" list="categories" value="${esc(x.category)}"><datalist id="categories"><option>Aluminium</option><option>Glass</option><option>Rubber</option><option>Wheel</option><option>Lock</option><option>Other</option></datalist></div><div class="field"><label>${t("unit")}</label><select name="unit">${["pcs","ft","sq ft","meter","kg","set","box"].map(u=>`<option ${x.unit===u?"selected":""}>${u}</option>`).join("")}</select></div><div class="field"><label>${t("length")}</label><input name="length" type="number" min="0" step=".01" value="${esc(x.length)}" placeholder="e.g. 21"></div><div class="field"><label>${t("quantity")}</label><input name="qty" type="number" min="0" step=".01" value="${p?x.qty:0}" ${p?"disabled":""}></div><div class="field"><label>Price mode / দামের ধরন</label><select name="priceMode"><option value="fixed" ${x.priceMode!=="percent"?"selected":""}>নির্দিষ্ট টাকা / Fixed</option><option value="percent" ${x.priceMode==="percent"?"selected":""}>মূল দামের শতাংশ / Percent</option></select></div><div class="field"><label>Base chart price / মূল দাম (৳)</label><input name="basePrice" type="number" min="0" step=".01" value="${esc(x.basePrice||0)}"></div><div class="field"><label>Buy % / কেনার শতাংশ</label><input name="buyPercent" type="number" min="0" step=".01" value="${esc(x.buyPercent??100)}"></div><div class="field"><label>Sell % / বিক্রির শতাংশ</label><input name="sellPercent" type="number" min="0" step=".01" value="${esc(x.sellPercent??100)}"></div><div class="field"><label>${t("buyPrice")} (fixed mode)</label><input name="buyPrice" type="number" min="0" step=".01" value="${esc(x.buyPrice)}"></div><div class="field"><label>${t("sellPrice")} (fixed mode)</label><input name="sellPrice" type="number" min="0" step=".01" value="${esc(x.sellPrice)}"></div><div class="field"><label>Low stock alert</label><input name="low" type="number" min="0" step=".01" value="${esc(x.low)}"></div></div><div class="form-actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn">${t("save")}</button></div></form>`);$("#productForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:p?.id||crypto.randomUUID(),name:f.get("name").trim(),code:f.get("code").trim(),category:f.get("category").trim(),unit:f.get("unit"),length:Number(f.get("length"))||0,priceMode:f.get("priceMode")||"fixed",basePrice:Number(f.get("basePrice"))||0,buyPercent:Number(f.get("buyPercent"))||0,sellPercent:Number(f.get("sellPercent"))||0,buyPrice:(f.get("priceMode")==="percent"?(Number(f.get("basePrice"))||0)*(Number(f.get("buyPercent"))||0)/100:(Number(f.get("buyPrice"))||0)),sellPrice:(f.get("priceMode")==="percent"?(Number(f.get("basePrice"))||0)*(Number(f.get("sellPercent"))||0)/100:(Number(f.get("sellPrice"))||0)),qty:p?p.qty:Number(f.get("qty"))||0,low:Number(f.get("low"))||0};if(!obj.name){toast(t("required"));return}if(p){data.products=data.products.map(z=>z.id===p.id?obj:z)}else{data.products.push(obj);if(obj.qty>0)data.movements.push({id:crypto.randomUUID(),productId:obj.id,productName:obj.name,type:"in",qty:obj.qty,note:"Opening stock",date:new Date().toISOString()})}persist();closeModal();render();toast(t("successProduct"))}}
function moveModal(type="in"){if(!data.products.length){toast(t("noProducts"));productModal();return}openModal(`<h3>${t("addStockTitle")}</h3><form id="moveForm"><div class="form-grid"><div class="field"><label>${t("type")}</label><select name="type"><option value="in" ${type==="in"?"selected":""}>${t("in")}</option><option value="out" ${type==="out"?"selected":""}>${t("out")}</option></select></div><div class="field"><label>${t("product")}</label><select name="productId" required>${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.qty} ${esc(p.unit)}</option>`).join("")}</select></div><div class="field"><label>${t("quantity")} *</label><input name="qty" type="number" min=".01" step=".01" required></div><div class="field"><label>${t("note")}</label><input name="note"></div></div><div class="form-actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn">${t("record")}</button></div></form>`);$("#moveForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=data.products.find(z=>z.id===f.get("productId")),q=Number(f.get("qty")),ty=f.get("type");if(!p||q<=0)return;if(ty==="out"&&q>p.qty){toast(t("notEnough"));return}p.qty+=ty==="in"?q:-q;data.movements.push({id:crypto.randomUUID(),productId:p.id,productName:p.name,type:ty,qty:q,note:f.get("note"),date:new Date().toISOString()});persist();closeModal();render();toast(t("successMove"))}}
function saleModal(){if(!data.products.length){toast(t("noProducts"));productModal();return}openModal(`<h3>${t("newSale")}</h3><form id="saleForm"><div class="form-grid"><div class="field"><label>${t("customer")}</label><input name="customer"></div><div class="field"><label>${t("product")}</label><select name="productId" id="saleProduct">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — stock ${p.qty}</option>`).join("")}</select></div><div class="field"><label>${t("qty")} *</label><input name="qty" type="number" min=".01" step=".01" required></div><div class="field"><label>${t("unitPrice")}</label><input name="price" id="salePrice" type="number" min="0" step=".01"></div></div><div class="form-actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn">${t("createInvoice")}</button></div></form>`);const updatePrice=()=>{let p=data.products.find(x=>x.id===$("#saleProduct").value);$("#salePrice").value=p?.sellPrice||0};$("#saleProduct").onchange=updatePrice;updatePrice();$("#saleForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=data.products.find(x=>x.id===f.get("productId")),q=Number(f.get("qty")),price=Number(f.get("price"));if(!p||q<=0)return;if(q>p.qty){toast(t("notEnough"));return}p.qty-=q;let s={id:crypto.randomUUID(),invoice:"TG-"+Date.now().toString().slice(-8),date:new Date().toISOString(),customer:f.get("customer"),items:[{productId:p.id,name:p.name,qty:q,price}],total:q*price};data.sales.push(s);data.movements.push({id:crypto.randomUUID(),productId:p.id,productName:p.name,type:"out",qty:q,note:s.invoice,date:s.date});persist();closeModal();currentPage="sales";render();toast(t("successSale"))}}
function showInvoice(id){let s=data.sales.find(x=>x.id===id);if(!s)return;openModal(`<div id="invoicePrint"><h2>${esc(data.settings.appName||"Thai Glass Inventory")}</h2><p>${t("invoice")}: <strong>${esc(s.invoice)}</strong><br>${t("date")}: ${esc(dateFmt(s.date))}<br>${t("customer")}: ${esc(s.customer||"—")}</p><table><thead><tr><th>${t("product")}</th><th>${t("qty")}</th><th>${t("unitPrice")}</th><th>${t("total")}</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join("")}</tbody></table><h3 style="text-align:right">${t("total")}: ${money(s.total)}</h3></div><div class="form-actions"><button class="btn secondary" data-close>${t("close")}</button><button class="btn" id="printInvoice">${t("print")}</button></div>`);$("#printInvoice").onclick=()=>{let w=window.open("","_blank");if(!w){toast("Allow pop-ups to print");return}w.document.write(`<html><head><title>${esc(s.invoice)}</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}</style></head><body>${$("#invoicePrint").innerHTML}</body></html>`);w.document.close();w.print()}}
function wirePage(){let b=(id,fn)=>{let el=$("#"+id);if(el)el.onclick=fn};b("dashAdd",()=>productModal());b("quickProduct",()=>productModal());b("addProductBtn",()=>productModal());b("quickIn",()=>moveModal("in"));b("quickOut",()=>moveModal("out"));b("addMoveBtn",()=>moveModal("in"));b("purchaseInBtn",()=>moveModal("in"));b("quickSale",saleModal);b("newSaleBtn",saleModal);b("addDailyEntry",dailyEntryModal);b("dailyViewDate",()=>{});if($("#dailyViewDate"))$("#dailyViewDate").onchange=e=>{dailyViewDate=e.target.value;render()};document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>productModal(data.products.find(p=>p.id===el.dataset.edit)));document.querySelectorAll("[data-invoice]").forEach(el=>el.onclick=()=>showInvoice(el.dataset.invoice));document.querySelectorAll("[data-page]").forEach(el=>el.onclick=()=>{currentPage=el.dataset.page;render()});if($("#productSearch")){let filter=()=>{let q=$("#productSearch").value.toLowerCase(),cat=$("#catFilter").value;$("#productBody").innerHTML=productRows(data.products.filter(p=>(p.name+" "+p.code+" "+p.category).toLowerCase().includes(q)&&(!cat||p.category===cat)))};$("#productSearch").oninput=filter;$("#catFilter").onchange=filter}if($("#reportMonth")){$("#reportMonth").onchange=()=>{const m=$("#reportMonth").value;const entries=data.dailyEntries.filter(e=>(e.date||"").slice(0,7)===m);const rows=entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(entryTypeLabel(e.type))}</td><td>${esc(e.contact||e.productName||"—")}</td><td>${money(e.amount)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">${t("empty")}</td></tr>`;$("#reportRows").innerHTML=rows;renderReportStats(m)};$("#reportPrint").onclick=()=>window.print()}
b("saveSettings",()=>{data.settings.appName=$("#appNameInput").value.trim()||"Inventory Manager";lang=$("#settingsLang").value;localStorage.setItem("tg_lang",lang);persist();render();toast(t("saveSettings"))});b("sbSaveConfig",()=>{cloudConfig={url:$("#sbUrl").value.trim().replace(/\/$/,""),key:$("#sbKey").value.trim()};localStorage.setItem("tg_cloud_config",JSON.stringify(cloudConfig));try{initCloudClient();toast("ক্লাউড সেটআপ সংরক্ষিত")}catch(e){toast(e.message||"সেটআপ সমস্যা")}render()});b("sbSignUp",()=>cloudLogin("signup"));b("sbSignIn",()=>cloudLogin("signin"));b("sbSignOut",signOutCloud);b("sbSyncNow",()=>cloudSync(true));b("sbCreateWorkspace",createWorkspace);b("sbAddMember",addWorkspaceMember);b("exportBtn",()=>{let a=document.createElement("a"),blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="thai-glass-inventory-backup.json";a.click();URL.revokeObjectURL(a.href)});b("importBtn",()=>$("#importFile").click());if($("#importFile"))$("#importFile").onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.products||!obj.movements||!obj.sales)throw 0;data=obj;persist();render();toast("Backup imported")}catch{toast("Invalid backup file")}}}
$("#langSelect").onchange=e=>{lang=e.target.value;localStorage.setItem("tg_lang",lang);render()};$("#settingsBtn").onclick=()=>{currentPage="settings";render()};
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();

window.addEventListener("online",()=>cloudSync(false));
